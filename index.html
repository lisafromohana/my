<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ohana Portal</title>

  <link rel="icon" type="image/x-icon" href="favicon.png">

  <!-- Correct scaling on phones/tablets; no pinch or auto-zoom. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    /* The outer page must never scroll. On iPhone Safari 100vh is TALLER than
       the visible screen (it includes the space behind the address bar), which
       cut off the bottom of the portal. And if the outer page can scroll,
       Safari slides it up when the keyboard opens (tap / paste in a field) and
       leaves it there, hiding the top of the portal.
       So: pin the page with position:fixed and size it to the real visible
       height (100dvh, with --app-h from JS as a fallback for older iOS). */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: #f0f2f5;
    }
    body {
      position: fixed;
      inset: 0;
      height: var(--app-h, 100%);
    }
    @supports (height: 100dvh) {
      body { height: var(--app-h, 100dvh); }
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe src="https://script.google.com/macros/s/AKfycbxwcMH5irlMuFX9xCryU5WVzcHutwTWV768pk0dsGKYs0tfA4daxwNC-tSHw0HWXwkV/exec" allow="clipboard-read; clipboard-write; picture-in-picture" allowfullscreen="true">
  </iframe>

  <script>
    // Keep the frame exactly as tall as the visible screen, and snap the outer
    // page back to the top whenever Safari tries to shift it (keyboard open /
    // close, paste prompt, address bar showing or hiding).
    (function () {
      var vv = window.visualViewport;
      function fit() {
        var h = vv ? vv.height : window.innerHeight;
        document.documentElement.style.setProperty('--app-h', Math.round(h) + 'px');
        if (window.scrollY || window.scrollX) window.scrollTo(0, 0);
      }
      fit();
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
      window.addEventListener('scroll', function () { if (window.scrollY || window.scrollX) window.scrollTo(0, 0); });
      if (vv) {
        vv.addEventListener('resize', fit);
        vv.addEventListener('scroll', function () { if (window.scrollY) window.scrollTo(0, 0); });
      }
      // When focus comes back from the portal (keyboard closed), re-fit.
      window.addEventListener('focus', function () { setTimeout(fit, 50); });
      document.addEventListener('focusout', function () { setTimeout(fit, 100); }, true);
    })();
  </script>

</body>
</html>
