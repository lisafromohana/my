<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ohana Portal</title>
  <link rel="icon" type="image/x-icon" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; 
      background-color: #f0f2f5; 
    }
  </style>
</head>
<body>
  <iframe 
    src="https://script.google.com/macros/s/AKfycbxwcMH5irlMuFX9xCryU5WVzcHutwTWV768pk0dsGKYs0tfA4daxwNC-tSHw0HWXwkV/exec"
    allow="clipboard-read; clipboard-write; picture-in-picture"
    sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-modals allow-downloads allow-top-navigation-by-user-activation allow-popups-to-escape-sandbox"
    allowfullscreen="true"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;">
  </iframe>
  <script>
    window.onload = function() {
      const frame = document.querySelector('iframe');
      if (frame.requestFullscreen) {
        frame.requestFullscreen().catch((err) => {
          console.log('Fullscreen requires user interaction:', err.message);
        });
      }
    };
  </script>
</body>
</html>
