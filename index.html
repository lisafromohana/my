<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ohana Portal</title>

  <link rel="icon" type="image/x-icon" href="favicon.png">

  <!-- Correct scaling on phones/tablets; no pinch or auto-zoom. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: #f0f2f5;
    }

    /* The frame is sized to the screen WITHOUT the keyboard (--app-h is set
       from window.innerHeight and only changes on rotation / address bar),
       so opening the keyboard never resizes or moves the portal. */
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--app-h, 100%);
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe src="https://script.google.com/macros/s/AKfycbxwcMH5irlMuFX9xCryU5WVzcHutwTWV768pk0dsGKYs0tfA4daxwNC-tSHw0HWXwkV/exec" allow="clipboard-read; clipboard-write; picture-in-picture" allowfullscreen="true">
  </iframe>

  <script>
    (function () {
      var vv = window.visualViewport;
      var fullH = window.innerHeight;

      function keyboardOpen() {
        // On iPhone the keyboard shrinks the visual viewport, not innerHeight.
        return vv && vv.height < window.innerHeight * 0.8;
      }

      function setHeight() {
        if (keyboardOpen()) return;            // never resize for the keyboard
        fullH = window.innerHeight;
        document.documentElement.style.setProperty('--app-h', fullH + 'px');
      }

      // iPhone Safari pushes the page up when the keyboard opens (e.g. typing
      // the password) and often leaves it there after the keyboard closes.
      // Force it back to the top a few times while it settles.
      function snapBack() {
        [0, 60, 200, 450].forEach(function (ms) {
          setTimeout(function () {
            if (keyboardOpen()) return;
            window.scrollTo(0, 0);
            document.documentElement.scrollTop = 0;
            document.body.scrollTop = 0;
          }, ms);
        });
      }

      setHeight();
      window.addEventListener('resize', function () { setHeight(); snapBack(); });
      window.addEventListener('orientationchange', function () { setTimeout(function () { setHeight(); snapBack(); }, 350); });
      window.addEventListener('scroll', function () { if (!keyboardOpen() && (window.scrollY || window.scrollX)) window.scrollTo(0, 0); });
      // Focus returning to this page = the keyboard was dismissed.
      window.addEventListener('focus', snapBack);

      if (vv) {
        var wasOpen = false;
        vv.addEventListener('resize', function () {
          var open = keyboardOpen();
          if (wasOpen && !open) { setHeight(); snapBack(); }   // keyboard just closed
          wasOpen = open;
        });
      }
    })();
  </script>

</body>
</html>
