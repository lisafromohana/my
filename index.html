<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ohana Portal</title>

  <link rel="icon" type="image/x-icon" href="favicon.png">
  
  <!-- Optimized Viewport: Forces correct scaling on all mobile phones and tablets -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <style>
    /* Ensure the background takes up exactly the screen size without scrollbars */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh; /* Using 'vh' handles mobile browser address bars much better than '%' */
      overflow: hidden; 
      background-color: #f0f2f5; 
    }

    /* Set the iframe to be fully responsive */
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- 
    Removed duplicate and restrictive 'sandbox' attributes to allow Google 
    Apps Script to connect cleanly without security conflicts.
  -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbxwcMH5irlMuFX9xCryU5WVzcHutwTWV768pk0dsGKYs0tfA4daxwNC-tSHw0HWXwkV/exec"
    allow="clipboard-read; clipboard-write; picture-in-picture"
    allowfullscreen="true">
  </iframe>

</body>
</html>
